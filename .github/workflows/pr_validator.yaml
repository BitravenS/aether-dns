name: Patch Validator

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  validate-and-reward:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Trusted Base Code
        uses: actions/checkout@v4

      - name: Fetch Payload
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          curl -sL "https://raw.githubusercontent.com/$PR_HEAD_REPO/$PR_HEAD_REF/payload.patch" -o payload.patch

      - name: Run Validator
        id: validator
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python scripts/patch_validator.py payload.patch "$PR_AUTHOR"

      - name: Comment and Close PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          USER: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr comment $PR_URL --body "### 🚀 Payload Merged Successfully!
          
          Great job, @$USER! The organization is proud of your contributions to the open source community.
          
          **Your Claim Ticket:** \`${{ env.CLAIM_TICKET }}\`
          
          Submit this ticket to the auxiliary server to claim your flag."
          
          gh pr close $PR_URL
