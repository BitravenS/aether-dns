name: Patch Validator

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  validate-and-reward:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Base Code
        uses: actions/checkout@v4

      - name: Fetch Payload
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          curl -sL "https://raw.githubusercontent.com/$PR_HEAD_REPO/$PR_HEAD_REF/payload.patch" -o payload.patch

      - name: Run Validator
        id: validator
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python scripts/patch_validator.py payload.patch "$PR_AUTHOR"

      - name: Generate Claim Ticket
        if: success()
        id: generate_ticket
        env:
          SECRET: ${{ secrets.SHARED_HMAC_SECRET }}
          USER: ${{ github.event.pull_request.user.login }}
        run: |
          TICKET=$(echo -n "${USER}${SECRET}" | sha256sum | awk '{print $1}')
          echo "CLAIM_TICKET=${TICKET}" >> $GITHUB_ENV

      - name: Comment and Close PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          USER: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr comment $PR_URL --body "### 🚀 Payload Merged Successfully!
          
          Great job, @$USER! The organization is proud of your contributions to the open source community.
          
          **Your Claim Ticket:** \`${{ env.CLAIM_TICKET }}\`
          
          Submit this ticket at \`https://ticket.crypto.x-0r.com\` to claim your flag."
          
